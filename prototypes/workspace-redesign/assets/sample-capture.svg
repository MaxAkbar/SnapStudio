  <!-- Editorial copy. -->
  <text x="58" y="169" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.6" fill="#9D634C">FOR THE WANDERERS AT HEART</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-2.5" fill="#294A3C">
    <text x="55" y="248">A little further.</text>
    <text x="55" y="315">A little freer.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#7B8376">
    <text x="58" y="356">Quiet trails. Wide horizons. The kind of places</text>
    <text x="58" y="379">that stay with you long after the journey ends.</text>
  </g>

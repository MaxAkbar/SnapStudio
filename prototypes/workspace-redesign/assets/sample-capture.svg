<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
  <title id="title">Northline outdoor travel website</title>
  <desc id="desc">An editorial travel homepage with a forest green and warm ivory palette, a mountain landscape, and three destination cards.</desc>
  <defs>
    <clipPath id="hero"><rect x="606" y="139" width="456" height="388" rx="8"/></clipPath>
    <clipPath id="card-one"><rect x="58" y="604" width="94" height="90" rx="5"/></clipPath>

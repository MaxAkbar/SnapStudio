name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SnapStudio.sln

      - name: Verify formatting
        run: dotnet format SnapStudio.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SnapStudio.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test SnapStudio.sln --configuration Release -p:Platform=x64

      - name: Package smoke
        run: .\eng\run-release-smoke.ps1 -Configuration Release -Platform x64

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: snapstudio-msix-x64
          path: artifacts/packages/*.msix
